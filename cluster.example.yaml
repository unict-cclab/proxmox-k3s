# proxmox-k3s cluster configuration
# Only proxmox credentials and control_plane nodes are required.

cluster_name: my-cluster          # default: "k3s-cluster"
kubeconfig_path: ./kubeconfig     # where to write the kubeconfig after creation

proxmox:
  api_url: https://192.168.1.10:8006/api2/json
  token_id: root@pam!mytoken
  token_secret: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  insecure_tls: true              # accept self-signed PVE certs (common in homelabs)

# VM template built once and reused for all cluster VMs.
template:
  # name: ubuntu-24.04-k3s-base  # optional: share one template across multiple clusters
  proxmox_node: pve1              # defaults to first control_plane node's proxmox_node
  storage: local-lvm              # storage for the template disk and cloud-init disk; must support "images"
  # image_storage: local          # optional staging storage for downloaded cloud images; needed for Ceph/RBD
  os: ubuntu-24.04                # resolves to the official Ubuntu cloud image
  bridge: vmbr0                   # template creation boots once for package upgrades on this network
  # Static IP for the temporary template boot. Leave commented to use DHCP instead.
  # ip: 192.168.1.90
  # gateway: 192.168.1.1
  # dns: 1.1.1.1
  # subnet_mask: 24
  # timeout_seconds: 1800        # optional: one timeout used for the whole template lifecycle
  # cloud_image_url: https://...  # override: bring your own cloud image

# k3s installation options.
k3s:
  version: v1.32.3+k3s1           # leave empty to auto-detect latest stable
  extra_server_args: "--disable=traefik --disable=servicelb"
  # extra_agent_args: ""

# Control plane nodes: 1 (standalone) or 3 (HA with embedded etcd).
# Omit ip/gateway/dns/subnet_mask to use DHCP.
control_plane:
  - name: cp-01
    proxmox_node: pve1
    storage: local-lvm
    bridge: vmbr0
    cores: 2
    memory: 4096
    disk_size: 20
    ip: 192.168.1.100
    gateway: 192.168.1.1
    dns: 1.1.1.1
    subnet_mask: 24

  # Uncomment for HA (3 nodes total):
  # - name: cp-02
  #   proxmox_node: pve2
  #   storage: local-lvm
  #   bridge: vmbr0
  #   cores: 2
  #   memory: 4096
  #   disk_size: 20
  #   ip: 192.168.1.101
  #   gateway: 192.168.1.1
  #   dns: 1.1.1.1
  #   subnet_mask: 24

  # - name: cp-03
  #   proxmox_node: pve3
  #   storage: local-lvm
  #   bridge: vmbr0
  #   cores: 2
  #   memory: 4096
  #   disk_size: 20
  #   ip: 192.168.1.102
  #   gateway: 192.168.1.1
  #   dns: 1.1.1.1
  #   subnet_mask: 24

workers:
  - name: worker-01
    proxmox_node: pve1
    storage: local-lvm
    bridge: vmbr0
    cores: 4
    memory: 4096
    disk_size: 40
    ip: 192.168.1.110
    gateway: 192.168.1.1
    dns: 1.1.1.1
    subnet_mask: 24
    labels:
      - "nodepool=workers"
    taints: []

  - name: worker-02
    proxmox_node: pve2
    storage: local-lvm
    bridge: vmbr0
    cores: 4
    memory: 4096
    disk_size: 40
    ip: 192.168.1.111
    gateway: 192.168.1.1
    dns: 1.1.1.1
    subnet_mask: 24
    labels:
      - "nodepool=workers"
    taints: []
