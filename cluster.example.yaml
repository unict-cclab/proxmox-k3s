# cluster.example.yaml — multi-cluster reference with all applicable options
# Copy to cluster.yaml (the default config path) and fill in your values.
#
# The two-file split (shared.yaml + clusters.yaml) is optional.
# You can keep everything in a single file and run:
#
#   proxmox-k3s setup-all    # provisions template, registry, nfs, then all clusters
#   proxmox-k3s delete-all   # tears everything down
#
# Or target individual resources:
#   proxmox-k3s template create  / delete
#   proxmox-k3s registry create  / delete
#   proxmox-k3s nfs      create  / delete
#   proxmox-k3s cluster  create  / delete  / kubeconfig  / mesh

# ---------------------------------------------------------------------------
# Proxmox API credentials (required)
# ---------------------------------------------------------------------------
proxmox:
  api_url: https://192.168.1.10:8006/api2/json
  token_id: root@pam!mytoken
  token_secret: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  insecure_tls: true              # set false in production with a valid TLS cert

# ---------------------------------------------------------------------------
# SSH key (optional)
# Auto-generated at ~/.proxmox-k3s/id_ed25519 if omitted.
# ---------------------------------------------------------------------------
# ssh_key_path: ~/.proxmox-k3s/id_ed25519

# ---------------------------------------------------------------------------
# VM template (required for cluster creation)
# Omit this block entirely if using a pre-existing template.
# ---------------------------------------------------------------------------
template:
  name: ubuntu-24.04-template   # VM name in Proxmox
  proxmox_node: pve             # Proxmox node to build the template on
  storage: local-lvm            # VM disk storage — must support "images" content type
  image_storage: local          # staging storage for the cloud image download — must support "import"
  os: ubuntu-24.04              # one of: ubuntu-24.04, ubuntu-22.04, debian-12
  # cloud_image_url:            # override to use a custom image URL
  bridge: vmbr0
  disk_size: 10                 # GB; default 10
  ip: 192.168.1.49              # static IP for the one-time template boot; omit for DHCP
  gateway: 192.168.1.1
  dns: 1.1.1.1
  subnet_mask: 24
  # password:                   # optional cloud-init password (SSH key auth is always enabled)
  # vmid_base: 8000             # first VMID to try when allocating the template VM
  # timeout_seconds: 1800       # max seconds to wait for template operations
  # clone_parallelism: 1        # max concurrent clones across all clusters

# ---------------------------------------------------------------------------
# Harbor registry VM (optional)
# Provides a pull-through cache for docker.io, ghcr.io, gcr.io, etc.
# ---------------------------------------------------------------------------
registry:
  vm:
    name: harbor
    proxmox_node: pve
    # template: ubuntu-24.04-template  # overrides template.name
    # storage: local-lvm              # overrides template.storage
    # bridge: vmbr0                    # overrides template.bridge
    cores: 4
    memory: 8192
    disk_size: 80
    ip: 192.168.1.50
    gateway: 192.168.1.1
    dns: 1.1.1.1
    subnet_mask: 24
  harbor:
    hostname: 192.168.1.50      # used by clusters to configure containerd mirrors
    admin_password: Harbor12345
    data_volume: /data
    http_port: 80

# ---------------------------------------------------------------------------
# NFS server VM (optional)
# Provides a shared RWX storage backend for all clusters via the NFS CSI driver.
# Each cluster gets its own subdirectory under data_dir.
# ---------------------------------------------------------------------------
nfs:
  vm:
    name: nfs-server
    proxmox_node: pve
    cores: 2
    memory: 2048
    disk_size: 100              # data disk size in GB
    ip: 192.168.1.51
    gateway: 192.168.1.1
    dns: 1.1.1.1
    subnet_mask: 24
  data_dir: /data/nfs           # base export path on the NFS server
  export_subnet: "192.168.1.0/24"  # who can mount (use "*" to allow all)

# ---------------------------------------------------------------------------
# Clusters
# ---------------------------------------------------------------------------
clusters:
  # --- Cluster with Cilium CNI and cluster mesh ---
  - name: cluster-01
    kubeconfig_path: ./kubeconfig-cluster-01
    pod_cidr: 10.42.0.0/16     # must be unique across all mesh clusters
    service_cidr: 10.43.0.0/16

    k3s:
      version: v1.32.3+k3s1
      # When using Cilium: disable flannel, network policy, and kube-proxy
      extra_server_args: "--disable=traefik --disable=servicelb --flannel-backend=none --disable-network-policy --disable-kube-proxy"
      # extra_agent_args: ""
      # taint_control_plane: true   # default true; set false to schedule workloads on CP nodes

    addons:
      # Cilium CNI — required for cluster mesh participation
      cilium:
        enabled: true
        # version: "1.19.4"         # omit to use the built-in default
        hubble_ui_node_port: 32080  # omit to use the built-in default

      # kube-prometheus-stack (Prometheus + Grafana)
      monitoring:
        enabled: true
        # version: "84.5.0"
        prometheus_node_port: 32090
        grafana_node_port: 32000
        grafana_admin_password: "admin"

      # mon-agent annotates nodes/deployments with Prometheus metrics. The
      # installer labels the default namespace with mon-agent/enabled=true.
      mon_agent:
        enabled: true
        # version: "v0.0.7"
        # prometheus_url: "http://prometheus-stack-kube-prom-prometheus.observability:9090"
        # scrape_period_seconds: 30
        # promql_range: "5m"
        # namespace_label_selector: "mon-agent/enabled=true"

      # cluster-lens topology UI, exposed through a NodePort.
      cluster_lens:
        enabled: true
        # version: "v0.0.7"
        node_port: 32088
        # refresh: "2s"

      # Loki + Alloy — collects HPA scaling events and exposes Loki for external queries
      # logging:
      #   enabled: true
      #   # loki_version: "6.41.1"
      #   # alloy_version: "1.4.0"
      #   loki_node_port: 32099
      #   # retention: "30d"
      #   # storage_size: "10Gi"

      # Istio service mesh — mutually exclusive with Cilium in most setups;
      # enable on clusters that use flannel instead
      # istio:
      #   enabled: false
      #   # version: "1.30.0"
      #   # gateway_api_version: "v1.3.0"  # omit to auto-resolve latest stable
      # jaeger:
      #   enabled: true             # requires istio.enabled: true
      #   node_port: 30002
      # kiali:                      # auto-installed with Istio; configure overrides here
      #   node_port: 30001

      # Pull-through registry — references a pre-existing Harbor instance
      registry:
        hostname: 192.168.1.50
        http_port: 80

      # NFS CSI driver — references a pre-existing NFS server
      nfs:
        enabled: true
        # version: "..."              # omit to use the built-in default
        server: 192.168.1.51
        data_dir: /data/nfs
        # export_subnet: "*"

      # Chaos Mesh — fault injection testing
      # chaos_mesh:
      #   enabled: true
      #   # version: "2.7.1"
      #   dashboard_node_port: 32300

      # Custom Pod Autoscaler operator — enabled by default; installs the
      # CustomPodAutoscaler CRD. Uncomment to override or set enabled: false.
      # custom_pod_autoscaler:
      #   enabled: false
      #   # version: "v1.4.2"
      #   # release: custom-pod-autoscaler-operator
      #   # namespace: default

      # Mentat — inter-node latency, packet loss, and bandwidth measurement
      # mentat:
      #   enabled: true
      #   # version: "v0.3.2"
      #   # sleep_seconds: 5
      #   # ping_attempts: 5
      #   # ping_timeout_seconds: 1
      #   # bandwidth_port: 2113
      #   # bandwidth_bytes: 262144
      #   # bandwidth_interval_seconds: 90
      #   # bandwidth_jitter_seconds: 30
      #   # bandwidth_timeout_seconds: 30

    # PersistentVolumeClaims are created after storage addons are installed.
    # Only name, namespace, storageClass, and size are configurable.
    pvcs:
      - name: application-data
        namespace: default
        storageClass: nfs
        size: 10Gi

    control_plane:
      - name: cp-01
        template: ubuntu-24.04-template
        proxmox_node: pve
        # storage: local-lvm
        # bridge: vmbr0
        cores: 4
        memory: 8192
        disk_size: 40
        ip: 192.168.1.100
        gateway: 192.168.1.1
        dns: 1.1.1.1
        subnet_mask: 24
      # Add two more nodes for HA (total must be 1 or 3):
      # - name: cp-02
      #   ...
      # - name: cp-03
      #   ...

    workers:
      - name: worker-01
        template: ubuntu-24.04-template
        proxmox_node: pve
        # storage: local-lvm
        # bridge: vmbr0
        cores: 4
        memory: 8192
        disk_size: 40
        ip: 192.168.1.110
        gateway: 192.168.1.1
        dns: 1.1.1.1
        subnet_mask: 24
        labels:
          - "nodepool=workers"
        taints: []

  # --- Cluster with Istio and flannel CNI ---
  - name: cluster-02
    kubeconfig_path: ./kubeconfig-cluster-02
    pod_cidr: 10.52.0.0/16
    service_cidr: 10.53.0.0/16

    k3s:
      version: v1.32.3+k3s1
      # Using flannel (no --flannel-backend=none); disable traefik and servicelb only
      extra_server_args: "--disable=traefik --disable=servicelb"

    addons:
      monitoring:
        enabled: true
        # version: "84.5.0"
        prometheus_node_port: 32090
        grafana_node_port: 32000
        grafana_admin_password: "admin"

      # Loki + Alloy — collects HPA scaling events and exposes Loki for external queries
      # logging:
      #   enabled: true
      #   # loki_version: "6.41.1"
      #   # alloy_version: "1.4.0"
      #   loki_node_port: 32099
      #   # retention: "30d"
      #   # storage_size: "10Gi"

      istio:
        enabled: true
        # version: "1.30.0"
        # gateway_api_version: "v1.3.0"
        # The installer labels the default namespace with istio-injection=enabled.

      # Jaeger all-in-one tracing (requires istio.enabled: true)
      # Deployed into the observability namespace.
      jaeger:
        enabled: true
        # version: "1.53"
        node_port: 30002          # UI on port 16686
        # storage_class: "local-path"
        # storage_size: "10Gi"

      # Kiali service mesh console — installed automatically when istio is enabled.
      # Configure node_port/version here if you need non-default values.
      kiali:
        # version: "v2.8"
        node_port: 30001          # UI on port 20001
        # signing_key: "proxmox-k3s-kiali"

      registry:
        hostname: 192.168.1.50
        http_port: 80

      nfs:
        enabled: true
        server: 192.168.1.51
        data_dir: /data/nfs

    control_plane:
      - name: cp-01
        template: ubuntu-24.04-template
        proxmox_node: pve
        cores: 4
        memory: 8192
        disk_size: 40
        ip: 192.168.1.200
        gateway: 192.168.1.1
        dns: 1.1.1.1
        subnet_mask: 24

    workers:
      - name: worker-01
        template: ubuntu-24.04-template
        proxmox_node: pve
        cores: 4
        memory: 8192
        disk_size: 40
        ip: 192.168.1.210
        gateway: 192.168.1.1
        dns: 1.1.1.1
        subnet_mask: 24
        labels:
          - "nodepool=workers"

# ---------------------------------------------------------------------------
# Cilium cluster mesh (optional)
# Only clusters with cilium.enabled: true can participate.
# IDs must be unique, in range 1–255.
# ---------------------------------------------------------------------------
cluster_mesh:
  - cluster: cluster-01
    id: 1
# cluster-02 uses flannel, so it cannot join the mesh
