version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - misspell
    - gochecknoinits
    - nilerr
    - bodyclose

  settings:
    misspell:
      locale: US

  exclusions:
    rules:
      # Ignoring the error from Close() is the standard Go idiom for deferred
      # cleanup and explicit teardown calls.
      - linters: [errcheck]
        text: "Error return value of `.*\\.Close` is not checked"
      # fmt.Fprint*/fmt.Scanln write to output writers; errors from these are
      # never actionable in a CLI tool.
      - linters: [errcheck]
        text: "Error return value of `fmt\\."

issues:
  max-same-issues: 0
