name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: proxmox-k3s version
      description: Output of `proxmox-k3s --version`
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: input
    id: proxmox-version
    attributes:
      label: Proxmox VE version
      placeholder: "8.3"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS where you run the CLI
      placeholder: "Ubuntu 24.04 / macOS 14 / ..."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Minimal cluster.yaml (remove all secrets)
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Full error output
      render: text
    validations:
      required: true
